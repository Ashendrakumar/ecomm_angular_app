<form [formGroup]="form" (ngSubmit)="submit()">
  <div *ngFor="let field of formConfig()">
    <label>{{ field.label }}</label>

    <!-- Input -->
    <input *ngIf="field.type !== 'select'" [type]="field.type" [formControlName]="field.name" />

    <!-- Select -->
    <select *ngIf="isSelectField(field)" [formControlName]="field.name">
      @if (field?.options && field.options.length > 0) {
        @for (opt of field.options; track opt.value) {
          <option [value]="opt.value" [disabled]="opt.disabled">{{ opt.label }}</option>
        }
      } @else {
        <option value="">Select</option>
      }
    </select>

    <!-- Error Messages -->
    <div class="error" *ngIf="form.get(field.name)?.touched && form.get(field.name)?.invalid">
      <div *ngFor="let validator of field.validators">
        <small *ngIf="form.get(field.name)?.hasError(validator.type)">
          {{ validator.message }}
        </small>
      </div>
    </div>
  </div>

  <button type="submit">Submit</button>
</form>
